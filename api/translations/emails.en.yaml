email:
  confirm:
    subject: "Confirm your email address"
    greeting: "Hello %firstname% %lastname%,"
    intro: "Thanks for signing up. Click the button below to confirm your email address and activate your account."
    button: "Confirm my email"
    expires: "This link expires in %expires%."
    fallback: "If the button doesn't work, copy and paste this link into your browser:"
    notice: "If you did not request this, you can ignore this email."
    plain: |
      Hello %firstname% %lastname%,

      Thanks for signing up. Copy and paste the following link into your browser to confirm your email address:
      %signedUrl%

      This link may expire.
  reset:
    subject: "Reset your password"
    greeting: "Hello %firstname% %lastname%,"
    intro: "You requested a password reset. Click the button below to choose a new password."
    button: "Reset my password"
    expires: "This link will expire on %expires%."
    fallback: "If the button doesn't work, copy and paste this link into your browser:"
    notice: "If you did not request a reset, you can ignore this email."
    plain: |
      Hello %firstname% %lastname%,

      You requested a password reset. Copy and paste the following link into your browser to set a new password:
      %resetUrl%

      This link will expire on %expires%.
